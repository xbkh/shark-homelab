<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Home Lab architecture">
  <title>Home Lab architecture</title>
  <rect width="1100" height="520" fill="#0a0a0b"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd400"/></marker>
  </defs>
  <!-- clients -->
  <g fill="#141416" stroke="#3a3a3f" stroke-width="2">
    <rect x="40" y="90" width="210" height="90" rx="10"/>
    <rect x="40" y="220" width="210" height="90" rx="10"/>
  </g>
  <g fill="#e9e9ec" font-size="20" font-weight="600">
    <text x="145" y="128" text-anchor="middle">iPhone</text>
    <text x="145" y="258" text-anchor="middle">Laptop</text>
  </g>
  <g fill="#9a9aa2" font-size="14">
    <text x="145" y="152" text-anchor="middle">Shark app (PWA), Moonlight</text>
    <text x="145" y="282" text-anchor="middle">Shark app, SSH, Moonlight</text>
  </g>
  <!-- VPN -->
  <rect x="300" y="130" width="170" height="140" rx="10" fill="#141416" stroke="#ffd400" stroke-width="2"/>
  <text x="385" y="185" text-anchor="middle" fill="#ffd400" font-size="22" font-weight="700">NetBird</text>
  <text x="385" y="212" text-anchor="middle" fill="#e9e9ec" font-size="14">WireGuard mesh VPN</text>
  <text x="385" y="234" text-anchor="middle" fill="#9a9aa2" font-size="13">direct peer to peer</text>
  <g stroke="#ffd400" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M250 135H298"/><path d="M250 265H298"/><path d="M470 200H528"/>
  </g>
  <!-- server -->
  <rect x="530" y="30" width="530" height="460" rx="14" fill="#101012" stroke="#ffd400" stroke-width="2"/>
  <path d="M1060 30v50l-50-50z" fill="#ffd400"/>
  <text x="556" y="64" fill="#ffd400" font-size="20" font-weight="700">Home server (Ubuntu, Docker)</text>
  <g fill="#141416" stroke="#3a3a3f" stroke-width="1.5">
    <rect x="556" y="90" width="236" height="76" rx="8"/><rect x="808" y="90" width="236" height="76" rx="8"/>
    <rect x="556" y="180" width="236" height="76" rx="8"/><rect x="808" y="180" width="236" height="76" rx="8"/>
    <rect x="556" y="270" width="236" height="76" rx="8"/><rect x="808" y="270" width="236" height="76" rx="8"/>
    <rect x="556" y="360" width="488" height="104" rx="8" stroke="#ffd400"/>
  </g>
  <g fill="#e9e9ec" font-size="18" font-weight="600">
    <text x="574" y="122">Nextcloud</text><text x="826" y="122">Immich</text>
    <text x="574" y="212">AdGuard Home</text><text x="826" y="212">Sunshine</text>
    <text x="574" y="302">Beszel</text><text x="826" y="302">Cockpit</text>
    <text x="574" y="392" fill="#ffd400" font-size="20">Shark dashboard</text>
  </g>
  <g fill="#9a9aa2" font-size="13">
    <text x="574" y="146">Files, calendar, contacts</text><text x="826" y="146">Photos and videos</text>
    <text x="574" y="236">DNS filtering and ads</text><text x="826" y="236">Game and desktop streaming</text>
    <text x="574" y="326">Server metrics</text><text x="826" y="326">Web terminal</text>
    <text x="574" y="420">FastAPI backend and installable web app: live metrics, service checks,</text>
    <text x="574" y="440">container restart and logs, backup status, alerts</text>
  </g>
  <!-- outbound -->
  <g stroke="#ffd400" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)">
    <path d="M556 414H500"/>
  </g>
  <g fill="#141416" stroke="#3a3a3f" stroke-width="1.5">
    <rect x="300" y="360" width="190" height="40" rx="8"/>
    <rect x="300" y="410" width="190" height="40" rx="8"/>
  </g>
  <g fill="#e9e9ec" font-size="15" font-weight="600">
    <text x="395" y="385" text-anchor="middle">ntfy push alerts</text>
    <text x="395" y="435" text-anchor="middle">Healthchecks heartbeat</text>
  </g>
</svg>
